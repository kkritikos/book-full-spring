apiVersion: apps/v1
kind: Deployment
metadata:
  name: book #Deployment name
  labels:
    app: book #label to find the respective pods to manage
    keel.sh/policy: all
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "1m"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: book
  template: #template for the replica/pod specification
    metadata:
      labels:
        app: book #label for the corresponding app
    spec: 
      containers:
      - name: book #container name
        image: kkritikos/book-spring-rest:1.0.0 #container image
        imagePullPolicy: Always
        ports:
        - containerPort: 30000 #container port
        env: #get environment vars from specific secret
         - name: DB_USER
           valueFrom:
             secretKeyRef:
               name: user-secret
               key: username
         - name: DB_PASSWORD
           valueFrom:
             secretKeyRef:
               name: user-secret
               key: password
         - name: DB_HOST
           value: "mysql"
         - name: DB_NAME
           value: "books"
         - name: SERVER_PORT
           value: "30000"
        resources:
            requests:
                memory: "512Mi"
                cpu: "500m"
            limits:
                memory: "1024Mi"
                cpu: "2000m"