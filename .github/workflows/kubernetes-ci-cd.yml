name: Continuous Integration and Delivery Workflow with Docker Push
run-name: Commit ${{ github.sha }} of branch ${{ github.ref}} by @${{ github.actor }}

on:
  push:
    branches:
      - kubernetes-ci-cd
    
permissions:
  contents: write  # Adjust permissions as needed

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          java-version: '21'
          distribution: 'adopt'

      - name: Compile, Unit Test and Install
        id: unit-tests
        run: mvn clean install

      - name: Upload test reports
        if: always() && steps.unit-tests.outcome == 'success'
        uses: actions/upload-artifact@v3
        with:
          name: test-reports
          path: '**/target/surefire-reports/*.xml'

      - name: Integration Test
        id: integration-tests
        run: mvn failsafe:integration-test

      - name: Upload integration test reports
        if: always() && steps.integration-tests.outcome == 'success'
        uses: actions/upload-artifact@v3
        with:
          name: integration-test-reports
          path: '**/target/failsafe-reports/*.xml'

  create-release:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Set up JDK 21
        uses: actions/setup-java@v2
        with:
          java-version: '21'
          distribution: 'adopt'

      - name: Compile
        run: mvn clean package -DskipTests

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: "dev-pre-release-${{ github.sha }}"
          release_name: "Release ${{ github.sha }}"
          body: "Automatically generated release from ${{ github.sha }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload JAR to GitHub Releases
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: book-spring/target/book-spring-0.1.jar
          asset_name: book-spring-0.1.jar
          asset_content_type: application/java-archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    needs: build-and-test # Ensure this job runs after the build job
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
         images: kkritikos/book-spring-rest
         tags: |
           1.0.0
           latest
           type=sha

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: docker.io/kkritikos/book-spring-rest
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
